name: Deploy the browser version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the engine
        run: |
          pip install -e .[dev]
          python -m pytest -q --ignore=tests/test_web_e2e.py
      - name: Build the site
        run: python tools/build_web.py
      - name: Test the site in a real browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m pytest -q tests/test_web_e2e.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
